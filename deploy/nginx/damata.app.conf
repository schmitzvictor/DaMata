# Reverse proxy pro site (container "app", só escuta em 127.0.0.1:3001).
# Depois de colocar este arquivo em /etc/nginx/sites-available/ e linkar em
# sites-enabled/, rode `certbot --nginx -d damata.app -d www.damata.app` —
# ele reescreve este arquivo sozinho, adicionando o server block 443/TLS e
# o redirect automático de 80 -> 443. Não precisa mexer no bloco `listen 80`
# abaixo antes disso.

server {
    listen 80;
    listen [::]:80;
    server_name damata.app www.damata.app;

    client_max_body_size 10m;

    # damata.app está com proxy ligado na Cloudflare (nuvem laranja) — sem
    # isso, $remote_addr é sempre um IP de borda da Cloudflare, não do
    # visitante, e o rate-limit por IP do app (src/lib/rate-limit.ts) fica
    # cego (todo mundo parece vir do mesmo lugar). CF-Connecting-IP é o
    # header que a própria Cloudflare recomenda pra isso — mais simples que
    # reconstruir a cadeia do X-Forwarded-For. Lista de ranges: valem tanto
    # pra IPv4 quanto IPv6; conferir se mudou em https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
