# Loja em endereço de teste (container "app" do site em 127.0.0.1:3001).
# Depois: sudo certbot --nginx -d loja.damata.app
# IP real da Cloudflare já vem de /etc/nginx/conf.d/cloudflare-real-ip.conf.
server {
    listen 80;
    listen [::]:80;
    server_name loja.damata.app;

    client_max_body_size 10m;
    # Ambiente de teste — não indexar.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
