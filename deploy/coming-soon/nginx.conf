# Página "em breve" enquanto a loja não está no ar. Substituir por
# deploy/nginx/damata.app.conf no deploy do site (e rodar certbot de novo).
server {
    listen 80;
    listen [::]:80;
    server_name damata.app www.damata.app;

    root /var/www/damata-embreve;
    location / { try_files $uri /index.html; }
}
